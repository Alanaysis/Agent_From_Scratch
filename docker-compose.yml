version: "3.8"

services:
  irg:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irg-agent
    restart: unless-stopped
    network_mode: host  # Access LAN gRPC devices
    volumes:
      # Mount working directory (projects)
      - ${IRG_WORKSPACE:-.}:/workspace
      # Persist IRG config and data
      - irg-data:/root/.irg
      # Mount proto files for gRPC
      - ${IRG_PROTO_DIR:-./protos}:/protos:ro
    environment:
      # LLM Configuration
      - IRG_LLM_PROVIDER=${IRG_LLM_PROVIDER:-openai}
      - IRG_LLM_API_KEY=${IRG_LLM_API_KEY}
      - IRG_LLM_MODEL=${IRG_LLM_MODEL:-gpt-4o-mini}
      - IRG_LLM_BASE_URL=${IRG_LLM_BASE_URL:-https://api.openai.com/v1}
      - IRG_LLM_SYSTEM_PROMPT=${IRG_LLM_SYSTEM_PROMPT:-}
      # Context Window
      - IRG_CONTEXT_WINDOW=${IRG_CONTEXT_WINDOW:-200000}
      - IRG_MAX_OUTPUT_TOKENS=${IRG_MAX_OUTPUT_TOKENS:-4096}
      # HTTP API Port
      - IRG_HTTP_PORT=${IRG_HTTP_PORT:-3002}
    working_dir: /workspace
    stdin_open: true  # For interactive CLI
    tty: true         # For interactive CLI

  # GUI mode (optional, run with: docker compose up irg-gui)
  irg-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irg-gui
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${IRG_WORKSPACE:-.}:/workspace
      - irg-data:/root/.irg
      - ${IRG_PROTO_DIR:-./protos}:/protos:ro
    environment:
      - IRG_LLM_PROVIDER=${IRG_LLM_PROVIDER:-openai}
      - IRG_LLM_API_KEY=${IRG_LLM_API_KEY}
      - IRG_LLM_MODEL=${IRG_LLM_MODEL:-gpt-4o-mini}
      - IRG_LLM_BASE_URL=${IRG_LLM_BASE_URL:-https://api.openai.com/v1}
      - IRG_CONTEXT_WINDOW=${IRG_CONTEXT_WINDOW:-200000}
      - IRG_MAX_OUTPUT_TOKENS=${IRG_MAX_OUTPUT_TOKENS:-4096}
    working_dir: /workspace
    command: ["npm", "run", "dev:gui"]
    ports:
      - "3001:3001"
      - "3002:3002"

volumes:
  irg-data:
    driver: local
